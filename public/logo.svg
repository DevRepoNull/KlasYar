<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="klasyar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f766e" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#klasyar-grad)" filter="url(#shadow)" />

  <!-- Accent Inner Glow / Border -->
  <rect x="7" y="7" width="106" height="106" rx="27" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.2" />

  <!-- Stylized Persian Letter 'ک' (KlasYar) -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Serash (Top slash of Kaf) -->
    <path d="M42 34 L78 24" stroke-width="7" />
    
    <!-- Main stem and base curve of Kaf -->
    <path d="M72 30 L50 68 C46 76, 52 86, 62 86 L80 86" stroke-width="7" />

    <!-- Modern dot / accent mark representing education/session star -->
    <circle cx="78" cy="52" r="3.5" fill="#ffffff" stroke="none" />
  </g>
</svg>
